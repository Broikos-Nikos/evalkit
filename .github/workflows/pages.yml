# Build, gate, and publish the page.
#
# Eight gates, and all of them run here.
#
# `npm run build` runs six before vite writes anything: the invisible character
# scan, the licence claim against the LICENSE, the input table recomputed from
# the published evaluation, the power calculation recomputed from it, the
# refusal rule applied to all four metrics, and every number in the README
# checked against those figures.
#
# Two need a served page and a real browser, so they run against the built
# output sharing one server: the instrument is held to the arithmetic behind it,
# and the recording at the top of the README is held to the page it claims to
# be.
#
# The point of gating a page like this is narrow and worth saying. The claim
# here is that a published comparison refused three of its four metrics, and
# the number that makes it true, the smallest difference this sample can
# detect, is computed rather than quoted. A page that shipped with that
# arithmetic broken would be an evaluation tool making the mistake it is about.
#
# Nothing deploys unless all of them pass, enforced twice: by the `needs:` on
# the deploy job, and by the fact that the two jobs running other people's code
# hold no credentials that could deploy. See the permissions note below.

name: pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Nothing by default. `pages: write` and `id-token: write` are the pair that
# creates a Pages deployment, and they are granted on the deploy job alone.
#
# `build` and `verify` run `npm ci`, which executes dependency postinstall
# hooks, and `npx playwright install --with-deps`, which installs system
# packages as root. Granting deployment credentials to the jobs that run other
# people's code, and then promising in the header that nothing deploys unless
# the gates pass, is a guarantee contradicted by the lines above it.
permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # persist-credentials: false, so the job's token is not left in
      # .git/config where an install hook could read it.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist
          retention-days: 1
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  verify:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist
      - run: npx playwright install --with-deps chromium
      # The gates drive the page a visitor gets, not the dev server. The server
      # comes from tools/serve.mjs: one preview on a port the operating system
      # hands out, proved byte for byte against dist/index.html before anything
      # measures it, and killed by a process group the spawn actually creates.
      - run: npm run verify

  deploy:
    # Only after all of them, and the only job holding the permissions that can
    # publish anything. A page whose count is wrong must not reach anyone just
    # because it built.
    needs: [build, verify]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
