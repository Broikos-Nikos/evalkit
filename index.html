<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="A published evaluation compared two models on 10,578 sentences and reported a difference of 5 rows. That sample can detect 178. Drag the difference and watch the verdict change."
    />
    <!--
      Inline, so there is no second request and no 404 in the console of the
      first person who opens it. A bar under a threshold, which is the thing this
      site draws.
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23080604'/%3E%3Crect x='2' y='10' width='4' height='3' fill='%239a8f88'/%3E%3Crect x='2' y='4' width='12' height='1' fill='%23ff6a00'/%3E%3C/svg%3E"
    />
    <title>evalkit</title>
    <!--
      The card a pasted link unfurls into. `tokenlab` RC-F11 was fixed in
      `tokenlab` alone on 2026-09-24, and the sweep at tick 229 asked the same
      question of the other seven with curl, which is what an unfurler sees
      because none of these pages are rendered by a service running JavaScript:
      six of the seven published pages carried none of the nine tags and handed
      Slack, a mail client or LinkedIn a bare link.

      `card.png` is in `public/` because that is what ships: `docs/` is in the
      repository and not on the site, so an og:image pointing there unfurls into
      a 404. The URL is absolute because a relative one is resolved against the
      service's own domain rather than this page's. `npm run card` takes it at
      1200 by 630, the size these services crop to, and records what was on
      screen in `docs/card.json`, which is where the `theme-color` below comes from.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://broikos-nikos.github.io/evalkit/" />
    <meta property="og:title" content="This evaluation can tell 178 rows apart. It was asked about 5.3." />
    <meta property="og:description" content="A published evaluation compared two models on 10,578 sentences and reported a difference of 5 rows. That sample can detect 178. Drag the difference and watch the verdict change." />
    <meta property="og:image" content="https://broikos-nikos.github.io/evalkit/card.png" />
    <meta property="og:image:alt" content="The first screen of the evalkit page, headed: This evaluation can tell 178 rows apart. It was asked about 5.3" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://broikos-nikos.github.io/evalkit/card.png" />
    <meta name="theme-color" content="#080604" />
  </head>
  <body>
    <header>
      <p class="wordmark">EVALKIT</p>
      <!-- The headline ships in the markup, AHEAD-F1. It is written again by
           main.ts from the measured data, and check:page holds the two equal, so a
           number that moves fails a gate instead of leaving this one stale. A
           reader with no javascript, a blocked bundle or a slow connection gets the
           sentence rather than an empty h1. -->
      <h1 data-headline>This evaluation can tell 178 rows apart. It was asked about 5.3.</h1>
      <p class="standfirst" data-standfirst></p>
    </header>

    <main>
      <!--
        The instrument. One control, and the measurement chose which one: holding
        the sample size and moving the difference spans 34x, while holding the
        difference and moving the sample size spans 1,125x, which is three
        decades and a slider whose useful region is a sliver.
      -->
      <section class="rig" aria-label="the instrument">
        <div class="rig__scale" data-scale></div>

        <label class="control">
          <span class="control__label">the difference between the two runs</span>
          <input type="range" data-rows min="0" max="250" step="1" value="5" />
          <output class="control__value" data-rows-value></output>
        </label>

        <p class="verdict" data-verdict>loading</p>
        <p class="sayable" data-sayable></p>
      </section>

      <noscript>
        <style>
          .rig, .table { display: none }
        </style>
        <p class="verdict">
          This page is an instrument you drag, so it needs javascript to do
          anything. Every number it computes is in the README, which needs none.
        </p>
      </noscript>

      <!-- And the four real comparisons, judged. -->
      <section class="table" data-table></section>

      <p class="caption" data-caption></p>
    </main>

    <footer data-footer></footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
