<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="A published evaluation compared two models on 10,578 sentences and reported a difference of 5 rows. That sample can detect 177. Drag the difference and watch the verdict change."
    />
    <!--
      Inline, so there is no second request and no 404 in the console of the
      first person who opens it. A bar under a threshold, which is the thing this
      site draws.
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23080604'/%3E%3Crect x='2' y='10' width='4' height='3' fill='%239a8f88'/%3E%3Crect x='2' y='4' width='12' height='1' fill='%23ff6a00'/%3E%3C/svg%3E"
    />
    <title>evalkit</title>
  </head>
  <body>
    <header>
      <p class="wordmark">EVALKIT</p>
      <!-- The headline ships in the markup, AHEAD-F1. It is written again by
           main.ts from the measured data, and check:page holds the two equal, so a
           number that moves fails a gate instead of leaving this one stale. A
           reader with no javascript, a blocked bundle or a slow connection gets the
           sentence rather than an empty h1. -->
      <h1 data-headline>This evaluation can tell 178 rows apart. It was asked about 5.3.</h1>
      <p class="standfirst" data-standfirst></p>
    </header>

    <main>
      <!--
        The instrument. One control, and the measurement chose which one: holding
        the sample size and moving the difference spans 34x, while holding the
        difference and moving the sample size spans 1,125x, which is three
        decades and a slider whose useful region is a sliver.
      -->
      <section class="rig" aria-label="the instrument">
        <div class="rig__scale" data-scale></div>

        <label class="control">
          <span class="control__label">the difference between the two runs</span>
          <input type="range" data-rows min="0" max="250" step="1" value="5" />
          <output class="control__value" data-rows-value></output>
        </label>

        <p class="verdict" data-verdict>loading</p>
        <p class="sayable" data-sayable></p>
      </section>

      <noscript>
        <style>
          .rig, .table { display: none }
        </style>
        <p class="verdict">
          This page is an instrument you drag, so it needs javascript to do
          anything. Every number it computes is in the README, which needs none.
        </p>
      </noscript>

      <!-- And the four real comparisons, judged. -->
      <section class="table" data-table></section>

      <p class="caption" data-caption></p>
    </main>

    <footer data-footer></footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
